<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в аккаунт</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login">
        <h1>Вход в аккаунт</h1>
        <p>Введите почту и пароль</p>

        <form>
            <label for="email">Электронная почта</label>
            <input type="email" id="email" name="email" placeholder="Введите почту" autocomplete="username">

            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" placeholder="Введите пароль" autocomplete="current-password">

            <button type="button">Войти</button>
        </form>
    </div>
</body>
</html>
