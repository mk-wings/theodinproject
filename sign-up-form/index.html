<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign up form project inspired by The Odin Project">
    <title>Sign-up Form | ODIN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <aside class="sidebar" aria-label="Decorative photo panel">
            <div class="brand">
                <img src="odin-logo.svg" alt="" class="brand-logo">
                <span>ODIN</span>
            </div>
            <p class="photo-credit">
                Photo by <a href="https://unsplash.com/" target="_blank" rel="noreferrer">Unsplash</a>
            </p>
        </aside>

        <main class="main-content">
            <section class="intro">
                <div class="intro-copy">
                    <p>This is not a real online service! You know you need something
                    like this in your life to help you realize your deepest dreams.</p>
                    <p>Sign up <em>now</em> to get started.</p>
                    <p class="you-want">You <em>know</em> you want to.</p>
                </div>
            </section>

            <section class="form-card">
                <h1>Let's do this!</h1>
                <form action="#" method="get" id="signup-form">
                    <div class="fields">
                        <div class="field">
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" id="first-name" name="first-name"
                                   autocomplete="given-name" required>
                        </div>
                        <div class="field">
                            <label for="last-name">LAST NAME</label>
                            <input type="text" id="last-name" name="last-name"
                                   autocomplete="family-name" required>
                        </div>
                        <div class="field">
                            <label for="email">EMAIL</label>
                            <input type="email" id="email" name="email"
                                   autocomplete="email" required>
                        </div>
                        <div class="field">
                            <label for="phone">PHONE NUMBER</label>
                            <input type="tel" id="phone" name="phone"
                                   autocomplete="tel">
                        </div>
                        <div class="field">
                            <label for="password">PASSWORD</label>
                            <input type="password" id="password" name="password"
                                   autocomplete="new-password" minlength="8" required>
                        </div>
                        <div class="field">
                            <label for="confirm-password">CONFIRM PASSWORD</label>
                            <input type="password" id="confirm-password"
                                   name="confirm-password" autocomplete="new-password"
                                   minlength="8" required>
                        </div>
                    </div>
                    <button type="submit">Create Account</button>
                </form>
            </section>

            <section class="login-prompt">
                <p>Already have an account? <a href="#">Log in</a></p>
            </section>
        </main>
    </div>
</body>
</html>
